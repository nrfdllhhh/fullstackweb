<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajemen Toko</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Manajemen Produk Toko 🛍️</h1>

        <div class="card">
            <h2>Tambah Produk Baru</h2>
            <form id="form-tambah-produk">
                <div class="form-grup">
                    <label for="nama-produk">Nama Produk:</label>
                    <input type="text" id="nama-produk" placeholder="Contoh: Keyboard Mechanical" required>
                </div>
                <div class="form-grup">
                    <label for="harga-produk">Harga:</label>
                    <input type="number" id="harga-produk" placeholder="Contoh: 350000" required>
                </div>
                <div class="form-grup">
                    <label for="stok-produk">Stok:</label>
                    <input type="number" id="stok-produk" placeholder="Contoh: 7" required>
                </div>
                <button type="submit" class="btn">Tambah Produk</button>
            </form>
        </div>

        <h2>Daftar Produk</h2>
        <div id="daftar-produk-container">
            </div>

    </div>

    <script src="javascript.js"></script>
</body>
</html>
