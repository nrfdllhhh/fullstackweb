<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Data Pegawai</title>
  <style>
    table {
      border-collapse: collapse;
      width: 60%;
      margin: 20px auto;
      font-family: Arial, sans-serif;
    }
    th, td {
      border: 1px solid #444;
      padding: 8px 12px;
      text-align: center;
    }
    thead {
      background-color: #f2f2f2;
    }
    tfoot {
      font-weight: bold;
      background-color: #e6ffe6;
    }
  </style>
</head>
<body>
  <script>
    // Data Pegawai
    let nama = "dodi prayodi";
    let umur = 25;
    let jabatan = "manajer";
    let status = "menikah";

    // Gaji Pokok
    let gapok = 0;
    if (jabatan.toLowerCase() === "manajer") {
      gapok = 15000000;
    } else if (jabatan.toLowerCase() === "asisten manajer") {
      gapok = 10000000;
    } else if (jabatan.toLowerCase() === "staff") {
      gapok = 5000000;
    }

    // Perhitungan
    let tunjanganJabatan = 0.15 * gapok;
    let bpjs = 0.10 * gapok;
    let tunjanganKeluarga = (status.toLowerCase() === "menikah") ? (0.20 * gapok) : 0;
    let totalGaji = gapok + tunjanganJabatan + bpjs + tunjanganKeluarga;

    // Cetak Tabel
    document.write(`
      <table>
        <thead>
          <tr>
            <th>Nama Pegawai</th>
            <th>Umur</th>
            <th>Jabatan</th>
            <th>Status</th>
            <th>Gaji Pokok</th>
            <th>Tunjangan Jabatan</th>
            <th>BPJS</th>
            <th>Tunjangan Keluarga</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>${nama}</td>
            <td>${umur}</td>
            <td>${jabatan}</td>
            <td>${status}</td>
            <td>Rp ${gapok.toLocaleString()}</td>
            <td>Rp ${tunjanganJabatan.toLocaleString()}</td>
            <td>Rp ${bpjs.toLocaleString()}</td>
            <td>Rp ${tunjanganKeluarga.toLocaleString()}</td>
          </tr>
        </tbody>
        <tfoot>
          <tr>
            <td colspan="7">Total Gaji</td>
            <td>Rp ${totalGaji.toLocaleString()}</td>
          </tr>
        </tfoot>
      </table>
    `);
  </script>
</body>
</html>
