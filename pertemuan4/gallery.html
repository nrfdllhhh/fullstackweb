</head>
<body>
  <h2>🖼 My Gallery</h2>

      <img src="./gambar/navbarcode.png" width="150" height="100">
      <img src="./gambar/tabel.png" width="150" height="100">
      <img src="./gambar/visdat.png" width="150" height="100">
      <img src="./gambar/visdat1.png" width="150" height="100">
    </marquee>
  </div>
</body>
</html>
